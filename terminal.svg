<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="Terminal intro: KTG, Full-Stack Developer and Data and AI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:'Fira Code','JetBrains Mono',Consolas,monospace;font-size:16px}
    .p{fill:#22d3ee}.c{fill:#e2e8f0}.v{fill:#a78bfa}.k{fill:#f472b6}.m{fill:#64748b}
    .l{opacity:0;animation:in .5s forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:1.2s}.l3{animation-delay:2.1s}
    .l4{animation-delay:3.0s}.l5{animation-delay:3.9s}.l6{animation-delay:4.8s}
    @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .glow{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.55}}
  </style>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect class="glow" x="1" y="1" width="818" height="248" rx="14" fill="#0b1020" stroke="url(#bd)" stroke-width="2"/>
  <rect x="1" y="1" width="818" height="36" rx="14" fill="#111936"/>
  <rect x="1" y="22" width="818" height="15" fill="#111936"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="m" style="font-size:13px">ktg@portfolio: ~</text>

  <g class="l l1"><text x="28" y="72"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text></g>
  <g class="l l2"><text x="28" y="96" class="v">KTG — Full-Stack Developer · Data &amp; AI Engineer</text></g>

  <g class="l l3"><text x="28" y="126"><tspan class="p">$</tspan><tspan class="c"> focus --list</tspan></text></g>
  <g class="l l4"><text x="28" y="150" class="v">Next.js apps · RAG &amp; LLM pipelines · SQL warehouses · Dashboards</text></g>

  <g class="l l5"><text x="28" y="180"><tspan class="p">$</tspan><tspan class="c"> cat mantra.txt</tspan></text></g>
  <g class="l l6"><text x="28" y="204" class="k">"Give me the Docs, and I'll deliver the Product"</text></g>
  <g class="l l6"><text x="28" y="232"><tspan class="p">$</tspan><tspan class="c cur"> █</tspan></text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
